<div class="auth-page-wrapper">
  <div class="auth-card card-glass wide-card">
    <div class="auth-header">
      <div class="auth-brand-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/>
        </svg>
      </div>
      <h2 class="auth-title">Create Single Account</h2>
      <p class="auth-subtitle">Register once to access both Provider (offer services) and Receiver (request jobs) features</p>
    </div>

    @if (errorMessage()) {
      <div class="alert-error">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label" for="reg-fullname">Full Name *</label>
          <input 
            type="text" 
            id="reg-fullname" 
            class="form-control" 
            placeholder="e.g. Kasun Fernando" 
            [ngModel]="fullName()" 
            (ngModelChange)="fullName.set($event)" 
            name="fullName" 
            required 
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Email Address *</label>
          <input 
            type="email" 
            id="reg-email" 
            class="form-control" 
            placeholder="kasun@example.com" 
            [ngModel]="email()" 
            (ngModelChange)="email.set($event)" 
            name="email" 
            required 
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-phone">Phone Number *</label>
          <input 
            type="tel" 
            id="reg-phone" 
            class="form-control" 
            placeholder="+94 77 123 4567" 
            [ngModel]="phoneNumber()" 
            (ngModelChange)="phoneNumber.set($event)" 
            name="phoneNumber" 
            required 
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-nic">NIC / Identification</label>
          <input 
            type="text" 
            id="reg-nic" 
            class="form-control" 
            placeholder="199212345678" 
            [ngModel]="nic()" 
            (ngModelChange)="nic.set($event)" 
            name="nic" 
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-city">City / Region</label>
          <input 
            type="text" 
            id="reg-city" 
            class="form-control" 
            placeholder="e.g. Negombo, Colombo" 
            [ngModel]="city()" 
            (ngModelChange)="city.set($event)" 
            name="city" 
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-address">Street Address</label>
          <input 
            type="text" 
            id="reg-address" 
            class="form-control" 
            placeholder="123 Main Street" 
            [ngModel]="address()" 
            (ngModelChange)="address.set($event)" 
            name="address" 
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Password *</label>
          <input 
            [type]="showPassword() ? 'text' : 'password'" 
            id="reg-password" 
            class="form-control" 
            placeholder="Min 6 characters" 
            [ngModel]="password()" 
            (ngModelChange)="password.set($event)" 
            name="password" 
            required 
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-confirm-password">Confirm Password *</label>
          <input 
            [type]="showPassword() ? 'text' : 'password'" 
            id="reg-confirm-password" 
            class="form-control" 
            placeholder="Re-type password" 
            [ngModel]="confirmPassword()" 
            (ngModelChange)="confirmPassword.set($event)" 
            name="confirmPassword" 
            required 
          />
        </div>
      </div>

      <div class="password-toggle-check">
        <label class="checkbox-label">
          <input type="checkbox" [checked]="showPassword()" (change)="toggleShowPassword()" />
          <span>Show password characters</span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary btn-lg submit-btn" [disabled]="isLoading()">
        @if (isLoading()) {
          <span class="spinner"></span>
          <span>Registering Account...</span>
        } @else {
          <span>Complete Registration</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
        }
      </button>
    </form>

    <div class="auth-footer">
      <p>Already have an account? <a routerLink="/login" class="auth-link">Sign in here</a></p>
    </div>
  </div>
</div>
